<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunset Drive</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function() {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let W, H, roadY, horizonY;

  // ──────────────────────────────────────
  //  RESIZE
  // ──────────────────────────────────────
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    roadY    = H * 0.78;
    horizonY = H * 0.58;
    initAllLayers();
  }

  // ──────────────────────────────────────
  //  UTILITY: seeded-ish random that looks natural
  // ──────────────────────────────────────
  function rand(min, max) { return min + Math.random() * (max - min); }
  function randi(min, max) { return Math.floor(rand(min, max + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // ──────────────────────────────────────
  //  PARALLAX LAYER
  // ──────────────────────────────────────
  class ParallaxLayer {
    constructor(speed, yBase, yRange, factory, minSpacing, maxSpacing) {
      this.speed = speed;       // px/s base speed
      this.yBase = yBase;       // base Y position
      this.yRange = yRange;     // vertical variation
      this.factory = factory;   // fn(x, yBase, yRange) -> element
      this.minSpacing = minSpacing;
      this.maxSpacing = maxSpacing;
      this.elements = [];
    }

    populate() {
      this.elements = [];
      let x = -50;
      while (x < W + 300) {
        const el = this.factory(x, this.yBase, this.yRange);
        this.elements.push(el);
        x += rand(this.minSpacing, this.maxSpacing);
      }
    }

    update(dt) {
      const dx = this.speed * dt;
      for (let i = this.elements.length - 1; i >= 0; i--) {
        this.elements[i].x -= dx;
        // remove when fully off-screen left
        if (this.elements[i].x + (this.elements[i].w || 60) < -100) {
          this.elements.splice(i, 1);
        }
      }
      // add new on the right
      let rightmost = 0;
      for (const e of this.elements) {
        if (e.x > rightmost) rightmost = e.x;
      }
      while (rightmost < W + 300) {
        rightmost += rand(this.minSpacing, this.maxSpacing);
        const el = this.factory(rightmost, this.yBase, this.yRange);
        this.elements.push(el);
      }
    }

    draw(ctx) {
      for (const e of this.elements) {
        if (e.x + (e.w || 100) < -50 || e.x > W + 50) continue;
        e.draw(ctx, e);
      }
    }
  }

  // ──────────────────────────────────────
  //  ELEMENT FACTORIES
  // ──────────────────────────────────────

  // Mountain silhouette — jagged peaks
  function makeMountain(x, yBase, yRange) {
    const h = rand(80, 220);
    const w = rand(200, 500);
    const peaks = randi(2, 4);
    const points = [];
    points.push({ x: 0, y: 0 });
    const segW = w / peaks;
    for (let i = 0; i < peaks; i++) {
      const peakX = i * segW + rand(segW * 0.3, segW * 0.7);
      const peakY = -(h * rand(0.4, 1.0));
      points.push({ x: peakX, y: peakY });
    }
    points.push({ x: w, y: 0 });

    // slight color variation for depth
    const shade = rand(-5, 8);
    const r = 24 + shade, g = 18 + shade, b = 38 + shade;
    const color = `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;

    return {
      x, w, h,
      y: yBase + rand(-yRange, yRange),
      draw(ctx, e) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        for (let i = 1; i < points.length - 1; i++) {
          ctx.lineTo(e.x + points[i].x, e.y + points[i].y);
        }
        ctx.lineTo(e.x + w, e.y);
        ctx.closePath();
        ctx.fill();
      }
    };
  }

  // Distant hill — smooth rolling shapes
  function makeHill(x, yBase, yRange) {
    const h = rand(40, 100);
    const w = rand(250, 550);
    const shade = rand(-8, 5);
    const r = 30 + shade, g = 22 + shade, b = 42 + shade;
    const color = `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
    const bumpX = rand(w * 0.2, w * 0.8);
    const bumpH = rand(0.5, 1.0);

    return {
      x, w, h,
      y: yBase + rand(-yRange * 0.5, yRange * 0.5),
      draw(ctx, e) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.quadraticCurveTo(e.x + bumpX, e.y - h * bumpH, e.x + w, e.y);
        ctx.closePath();
        ctx.fill();
      }
    };
  }

  // Conifer tree
  function makeConifer(x, yBase) {
    const h = rand(45, 95);
    const w = rand(16, 32);
    const shade = rand(-10, 5);
    const r = 18 + shade, g = 30 + shade, b = 12 + shade;
    const color = `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;

    return {
      x, w, h,
      y: yBase,
      draw(ctx, e) {
        const bx = e.x + w / 2;
        const by = e.y;
        ctx.fillStyle = '#2a1a0a';
        ctx.fillRect(bx - w * 0.12, by - h * 0.85, w * 0.24, h * 0.85); // trunk
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(bx, by - h);
        ctx.lineTo(bx - w / 2, by - h * 0.35);
        ctx.lineTo(bx + w / 2, by - h * 0.35);
        ctx.closePath();
        ctx.fill();
        // middle tier
        ctx.beginPath();
        ctx.moveTo(bx, by - h * 0.72);
        ctx.lineTo(bx - w * 0.45, by - h * 0.15);
        ctx.lineTo(bx + w * 0.45, by - h * 0.15);
        ctx.closePath();
        ctx.fill();
        // bottom tier
        ctx.beginPath();
        ctx.moveTo(bx, by - h * 0.42);
        ctx.lineTo(bx - w * 0.55, by + h * 0.05);
        ctx.lineTo(bx + w * 0.55, by + h * 0.05);
        ctx.closePath();
        ctx.fill();
      }
    };
  }

  // Rounded deciduous tree
  function makeRoundTree(x, yBase) {
    const h = rand(50, 100);
    const r = rand(20, 40);
    const shade = rand(-15, 10);
    const cr = 25 + shade, cg = 45 + shade, cb = 15 + shade;
    const color = `rgb(${Math.round(cr)},${Math.round(cg)},${Math.round(cb)})`;

    return {
      x, w: r * 2.5, h,
      y: yBase,
      draw(ctx, e) {
        const bx = e.x + e.w / 2;
        const by = e.y;
        // trunk
        ctx.fillStyle = '#3a2010';
        ctx.fillRect(bx - 3, by - r * 0.6, 6, r * 0.6);
        // canopy
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(bx, by - r * 1.0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(bx - r * 0.5, by - r * 1.15, r * 0.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(bx + r * 0.55, by - r * 1.1, r * 0.75, 0, Math.PI * 2);
        ctx.fill();
      }
    };
  }

  // Utility pole
  function makePole(x, yBase) {
    const h = rand(80, 150);
    const w = 6;
    const wireLeftY  = rand(-5, 15);
    const wireRightY = rand(-5, 15);
    return {
      x, w, h,
      y: yBase,
      draw(ctx, e) {
        ctx.fillStyle = '#3a3028';
        ctx.fillRect(e.x + 2, e.y - h, 4, h);
        // crossbar
        ctx.fillRect(e.x - 10, e.y - h + 8, 26, 3);
        // wires (subtle, barely visible against sky)
        ctx.strokeStyle = 'rgba(60,50,40,0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(e.x - 10, e.y - h + 9);
        ctx.lineTo(e.x - 120, e.y - h + 9 + wireLeftY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(e.x + 16, e.y - h + 9);
        ctx.lineTo(e.x + 120, e.y - h + 9 + wireRightY);
        ctx.stroke();
      }
    };
  }

  // Bush / low shrub
  function makeBush(x, yBase, yRange) {
    const w = rand(25, 55);
    const h = rand(15, 35);
    const shade = rand(-10, 10);
    const r = 28 + shade, g = 40 + shade, b = 14 + shade;
    const color = `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;

    return {
      x, w, h,
      y: yBase + rand(-yRange, yRange),
      draw(ctx, e) {
        const bx = e.x + w / 2;
        const by = e.y;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(bx, by - h * 0.5, w * 0.5, h * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(bx - w * 0.2, by - h * 0.4, w * 0.35, h * 0.45, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(bx + w * 0.25, by - h * 0.35, w * 0.3, h * 0.4, 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
    };
  }

  // Cloud
  function makeCloud(x, yBase, yRange) {
    const w = rand(60, 180);
    const h = rand(20, 50);
    const alpha = rand(0.08, 0.22);

    return {
      x, w, h,
      y: yBase + rand(-yRange, yRange),
      draw(ctx, e) {
        ctx.fillStyle = `rgba(255,220,180,${alpha})`;
        const bx = e.x + w / 2;
        const by = e.y;
        ctx.beginPath();
        ctx.ellipse(bx, by, w * 0.45, h * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(bx - w * 0.28, by + h * 0.1, w * 0.3, h * 0.4, -0.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(bx + w * 0.3, by + h * 0.05, w * 0.32, h * 0.42, 0.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(bx + w * 0.1, by - h * 0.3, w * 0.28, h * 0.45, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    };
  }

  // Road marking (dashed center line)
  function makeRoadMarking(x) {
    const dashW = rand(30, 55);
    return {
      x, w: dashW, h: 4,
      y: roadY + (H - roadY) * 0.48,
      draw(ctx, e) {
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillRect(e.x, e.y, e.w, e.h);
      }
    };
  }

  // Road shoulder marking
  function makeShoulderMarking(x) {
    const dashW = rand(35, 70);
    return {
      x, w: dashW, h: 2,
      y: roadY + (H - roadY) * 0.15,
      draw(ctx, e) {
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(e.x, e.y, e.w, e.h);
      }
    };
  }

  // ──────────────────────────────────────
  //  LAYERS
  // ──────────────────────────────────────
  const layers = {};

  function initAllLayers() {
    const baseSpeed = W * 0.15; // scales with canvas width for consistent feel

    layers.clouds = new ParallaxLayer(baseSpeed * 0.02, H * 0.15, H * 0.12, makeCloud, 300, 600);
    layers.mountains = new ParallaxLayer(baseSpeed * 0.08, horizonY + 8, 5, makeMountain, 250, 450);
    layers.hills = new ParallaxLayer(baseSpeed * 0.12, horizonY + 3, 8, makeHill, 200, 400);
    layers.farTrees = new ParallaxLayer(baseSpeed * 0.28, horizonY + 25, 12, makeConifer, 60, 160);
    layers.poles = new ParallaxLayer(baseSpeed * 0.32, roadY - 10, 3, makePole, 400, 700);
    layers.midTrees = new ParallaxLayer(baseSpeed * 0.55, roadY - 2, 10, makeRoundTree, 100, 220);
    layers.bushes = new ParallaxLayer(baseSpeed * 0.7, roadY - 5, 8, makeBush, 70, 150);
    layers.shoulders = new ParallaxLayer(baseSpeed * 1.1, roadY, 0, makeShoulderMarking, 80, 180);
    layers.roadMarks = new ParallaxLayer(baseSpeed * 1.3, roadY, 0, makeRoadMarking, 90, 160);

    for (const key in layers) {
      layers[key].populate();
    }
  }

  // ──────────────────────────────────────
  //  SKY
  // ──────────────────────────────────────
  function drawSky() {
    // sunset gradient
    const grad = ctx.createLinearGradient(0, 0, 0, horizonY + 20);
    grad.addColorStop(0,    '#12062e');
    grad.addColorStop(0.25, '#2a1050');
    grad.addColorStop(0.5,  '#5c1a4a');
    grad.addColorStop(0.7,  '#9c2c40');
    grad.addColorStop(0.85, '#d45a30');
    grad.addColorStop(1,    '#f0a040');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, horizonY + 20);

    // sun
    const sunX = W * 0.65;
    const sunY = horizonY - 25;
    const sunR = W * 0.06;

    // sun glow
    const glow = ctx.createRadialGradient(sunX, sunY, sunR * 0.5, sunX, sunY, sunR * 3);
    glow.addColorStop(0, 'rgba(255,240,200,1)');
    glow.addColorStop(0.15, 'rgba(255,220,140,0.85)');
    glow.addColorStop(0.4, 'rgba(255,180,60,0.4)');
    glow.addColorStop(0.7, 'rgba(255,140,30,0.08)');
    glow.addColorStop(1, 'rgba(255,100,20,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(sunX, sunY, sunR * 3, 0, Math.PI * 2);
    ctx.fill();

    // sun disc
    const disc = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR);
    disc.addColorStop(0, '#fffef0');
    disc.addColorStop(0.4, '#ffe8b0');
    disc.addColorStop(1, '#f0c040');
    ctx.fillStyle = disc;
    ctx.beginPath();
    ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
    ctx.fill();
  }

  // ──────────────────────────────────────
  //  GROUND & ROAD
  // ──────────────────────────────────────
  function drawGround() {
    // distant ground
    const gGrad = ctx.createLinearGradient(0, horizonY, 0, roadY);
    gGrad.addColorStop(0, '#3d2818');
    gGrad.addColorStop(0.3, '#4a3020');
    gGrad.addColorStop(0.7, '#5c3a24');
    gGrad.addColorStop(1, '#6b4430');
    ctx.fillStyle = gGrad;
    ctx.fillRect(0, horizonY, W, roadY - horizonY);
  }

  let roadLines = null;
  let lastRoadH = 0;

  function drawRoad() {
    // road surface
    const rGrad = ctx.createLinearGradient(0, roadY, 0, H);
    rGrad.addColorStop(0, '#3a3a3e');
    rGrad.addColorStop(0.3, '#444448');
    rGrad.addColorStop(1, '#4a4a4e');
    ctx.fillStyle = rGrad;
    ctx.fillRect(0, roadY, W, H - roadY);

    // road edge lines (solid)
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, roadY + 4);
    ctx.lineTo(W, roadY + 4);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, roadY + (H - roadY) * 0.8);
    ctx.lineTo(W, roadY + (H - roadY) * 0.8);
    ctx.stroke();

    // subtle road texture (regenerate only on resize)
    const roadH = H - roadY;
    if (!roadLines || roadH !== lastRoadH) {
      roadLines = [];
      for (let i = 0; i < 20; i++) {
        roadLines.push(8 + Math.random() * Math.max(roadH - 12, 1));
      }
      lastRoadH = roadH;
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (const y of roadLines) {
      ctx.beginPath();
      ctx.moveTo(0, roadY + y);
      ctx.lineTo(W, roadY + y);
      ctx.stroke();
    }
  }

  // ──────────────────────────────────────
  //  CAR
  // ──────────────────────────────────────
  function drawCar(cx, cy, scale, wheelAngle, suspensionY, suspensionPitch) {
    ctx.save();
    ctx.translate(cx, cy + suspensionY);
    ctx.rotate(suspensionPitch);

    const s = scale;
    // car dimensions at scale=1
    const bodyLen  = 340 * s;
    const bodyH    = 70 * s;
    const wheelR   = 36 * s;
    const wheelBase = 190 * s;
    const groundY   = 0; // car sits relative to ground

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(0, groundY + wheelR * 0.9, bodyLen * 0.48, wheelR * 0.25, 0, 0, Math.PI * 2);
    ctx.fill();

    // ── WHEELS ──
    const frontWheelX = wheelBase / 2;
    const rearWheelX  = -wheelBase / 2;
    const wheelCY = groundY - wheelR * 0.75;

    function drawWheel(wx, wy) {
      // tire
      ctx.fillStyle = '#1a1a1e';
      ctx.beginPath();
      ctx.arc(wx, wy, wheelR, 0, Math.PI * 2);
      ctx.fill();

      // tire tread ring
      ctx.strokeStyle = '#2a2a2e';
      ctx.lineWidth = wheelR * 0.12;
      ctx.beginPath();
      ctx.arc(wx, wy, wheelR * 0.92, 0, Math.PI * 2);
      ctx.stroke();

      // hub
      ctx.fillStyle = '#555';
      ctx.beginPath();
      ctx.arc(wx, wy, wheelR * 0.42, 0, Math.PI * 2);
      ctx.fill();

      // hub ring
      ctx.strokeStyle = '#777';
      ctx.lineWidth = wheelR * 0.04;
      ctx.beginPath();
      ctx.arc(wx, wy, wheelR * 0.35, 0, Math.PI * 2);
      ctx.stroke();

      // spokes
      ctx.strokeStyle = '#666';
      ctx.lineWidth = wheelR * 0.05;
      for (let i = 0; i < 5; i++) {
        const a = wheelAngle + (i / 5) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(wx, wy);
        ctx.lineTo(wx + Math.cos(a) * wheelR * 0.38, wy + Math.sin(a) * wheelR * 0.38);
        ctx.stroke();
      }

      // center cap
      ctx.fillStyle = '#888';
      ctx.beginPath();
      ctx.arc(wx, wy, wheelR * 0.12, 0, Math.PI * 2);
      ctx.fill();
    }

    drawWheel(frontWheelX, wheelCY);
    drawWheel(rearWheelX, wheelCY);

    // wheel well dark areas (drawn over wheels)
    // We'll skip those and just draw the body over wheels

    // ── CAR BODY ──
    const bodyBottom = wheelCY - wheelR * 0.95;
    const bodyTop = bodyBottom - bodyH;

    // Main body (lower)
    ctx.fillStyle = '#cc2233';
    ctx.beginPath();
    // rear bumper to front: start bottom-rear, go up for rear, roof line, down windshield, hood, front
    const rearX  = -bodyLen * 0.45;
    const frontX = bodyLen * 0.49;
    const bodyMidY = bodyBottom - bodyH * 0.55; // middle of body height

    // Body shape: classic fastback / sport sedan
    ctx.moveTo(rearX, bodyBottom);                                // bottom rear
    ctx.lineTo(rearX, bodyBottom - bodyH * 0.6);                  // rear panel
    ctx.lineTo(rearX + bodyLen * 0.22, bodyBottom - bodyH * 0.95); // rear window start
    ctx.lineTo(rearX + bodyLen * 0.48, bodyBottom - bodyH * 1.0);  // roof peak
    ctx.lineTo(rearX + bodyLen * 0.68, bodyBottom - bodyH * 0.75); // windshield top
    ctx.lineTo(frontX, bodyBottom - bodyH * 0.55);                 // hood front
    ctx.lineTo(frontX, bodyBottom - bodyH * 0.2);                  // front nose drop
    ctx.lineTo(frontX, bodyBottom);                                // front bottom
    // close along bottom, with wheel well cutouts
    ctx.lineTo(frontWheelX + wheelR * 0.7, bodyBottom);
    ctx.quadraticCurveTo(frontWheelX, bodyBottom + wheelR * 0.05, frontWheelX - wheelR * 0.7, bodyBottom);
    ctx.lineTo(rearWheelX + wheelR * 0.7, bodyBottom);
    ctx.quadraticCurveTo(rearWheelX, bodyBottom + wheelR * 0.05, rearWheelX - wheelR * 0.7, bodyBottom);
    ctx.closePath();
    ctx.fill();

    // Body highlight (slightly lighter stripe along the side)
    ctx.fillStyle = 'rgba(220,140,140,0.25)';
    ctx.beginPath();
    ctx.moveTo(rearX, bodyBottom - bodyH * 0.3);
    ctx.lineTo(frontX, bodyBottom - bodyH * 0.3);
    ctx.lineTo(frontX, bodyBottom - bodyH * 0.45);
    ctx.lineTo(rearX, bodyBottom - bodyH * 0.45);
    ctx.closePath();
    ctx.fill();

    // ── ROOF / CABIN ──
    // dark cabin area (windows)
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath();
    const cabinRear  = rearX + bodyLen * 0.18;
    const cabinFront = rearX + bodyLen * 0.70;
    ctx.moveTo(cabinRear, bodyBottom - bodyH * 0.58);
    ctx.lineTo(cabinRear + bodyLen * 0.04, bodyBottom - bodyH * 0.92);  // rear window up
    ctx.lineTo(cabinRear + bodyLen * 0.30, bodyBottom - bodyH * 0.97); // roof
    ctx.lineTo(cabinFront, bodyBottom - bodyH * 0.70);                  // windshield top
    ctx.lineTo(cabinFront, bodyBottom - bodyH * 0.58);                  // windshield base
    ctx.closePath();
    ctx.fill();

    // Window reflection
    ctx.fillStyle = 'rgba(160,200,240,0.12)';
    ctx.beginPath();
    ctx.moveTo(cabinRear + bodyLen * 0.06, bodyBottom - bodyH * 0.62);
    ctx.lineTo(cabinRear + bodyLen * 0.10, bodyBottom - bodyH * 0.75);
    ctx.lineTo(cabinRear + bodyLen * 0.35, bodyBottom - bodyH * 0.65);
    ctx.lineTo(cabinRear + bodyLen * 0.08, bodyBottom - bodyH * 0.62);
    ctx.closePath();
    ctx.fill();

    // ── DETAILS ──

    // front bumper / lower intake
    ctx.fillStyle = '#1a1a1e';
    ctx.fillRect(frontX - bodyLen * 0.04, bodyBottom - bodyH * 0.15, bodyLen * 0.06, bodyH * 0.12);

    // headlight
    ctx.fillStyle = '#fffde8';
    ctx.beginPath();
    ctx.ellipse(frontX - bodyLen * 0.02, bodyBottom - bodyH * 0.5, bodyLen * 0.03, bodyH * 0.15, 0.1, 0, Math.PI * 2);
    ctx.fill();
    // headlight glow
    ctx.fillStyle = 'rgba(255,250,220,0.2)';
    ctx.beginPath();
    ctx.arc(frontX - bodyLen * 0.01, bodyBottom - bodyH * 0.5, bodyLen * 0.05, 0, Math.PI * 2);
    ctx.fill();

    // taillight
    ctx.fillStyle = '#ff2230';
    ctx.fillRect(rearX + 2, bodyBottom - bodyH * 0.5, bodyLen * 0.025, bodyH * 0.2);

    // door line
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cabinFront + bodyLen * 0.02, bodyBottom - bodyH * 0.2);
    ctx.lineTo(cabinFront, bodyBottom - bodyH * 0.55);
    ctx.stroke();

    // door handle
    ctx.fillStyle = 'rgba(200,200,210,0.5)';
    ctx.fillRect(cabinFront - bodyLen * 0.02, bodyBottom - bodyH * 0.42, bodyLen * 0.025, bodyH * 0.06);

    // side mirror
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.ellipse(cabinFront - bodyLen * 0.02, bodyBottom - bodyH * 0.65, bodyLen * 0.015, bodyH * 0.08, 0, 0, Math.PI * 2);
    ctx.fill();

    // side skirt / rocker panel dark
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(rearX, bodyBottom - bodyH * 0.08, bodyLen, bodyH * 0.05);

    ctx.restore();
  }

  // ──────────────────────────────────────
  //  VIGNETTE
  // ──────────────────────────────────────
  function drawVignette() {
    const grad = ctx.createRadialGradient(W / 2, H / 2, W * 0.45, W / 2, H / 2, W * 0.75);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  // ──────────────────────────────────────
  //  ANIMATION LOOP
  // ──────────────────────────────────────
  let lastTime = performance.now();
  let wheelAngle = 0;
  let totalTime = 0;

  function animate(timestamp) {
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    if (dt > 0.15) dt = 0.15; // cap to avoid jumps
    totalTime += dt;

    // clear
    ctx.clearRect(0, 0, W, H);

    // draw sky
    drawSky();

    // layers behind ground (mountains, hills, distant trees — silhouettes at/above horizon)
    const behindGround = ['clouds', 'mountains', 'hills', 'farTrees'];
    for (const key of behindGround) {
      layers[key].update(dt);
      layers[key].draw(ctx);
    }

    // ground (covers lower portions of distant layers)
    drawGround();

    // layers in front of ground (roadside scenery)
    const frontOfGround = ['poles', 'midTrees', 'bushes'];
    for (const key of frontOfGround) {
      layers[key].update(dt);
      layers[key].draw(ctx);
    }

    // road
    drawRoad();
    layers.shoulders.update(dt);
    layers.shoulders.draw(ctx);
    layers.roadMarks.update(dt);
    layers.roadMarks.draw(ctx);

    // car
    const carScale = Math.min(W / 1200, H / 700) * 0.85;
    const baseSpeed = W * 0.15;
    const roadSpeed = baseSpeed * 1.3; // speed of the fastest layer (road markings)
    // wheel rotation: angular velocity = linear speed / radius
    const actualWheelR = 36 * carScale;
    const wheelRotPerSec = roadSpeed / actualWheelR; // radians per second
    wheelAngle += wheelRotPerSec * dt;

    // suspension bounce
    const suspFreq = 4.5;  // Hz
    const suspAmp = 2.5;   // pixels
    const suspensionY = Math.sin(totalTime * suspFreq * Math.PI * 2) * suspAmp;
    const suspensionPitch = Math.sin(totalTime * suspFreq * 1.3 * Math.PI * 2 + 0.7) * 0.008;

    // car position
    const carX = W * 0.38;
    const carY = roadY - 8;

    drawCar(carX, carY, carScale, wheelAngle, suspensionY, suspensionPitch);

    // vignette on top
    drawVignette();

    requestAnimationFrame(animate);
  }

  // ──────────────────────────────────────
  //  INIT
  // ──────────────────────────────────────
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(animate);

})();
</script>
</body>
</html>
