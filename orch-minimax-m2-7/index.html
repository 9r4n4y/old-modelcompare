<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scenic Drive</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
}
resize();
window.addEventListener('resize', resize);

const dpr = devicePixelRatio;
const getMaxH = () => window.innerHeight;

// ─── UTILS ──────────────────────────────────────────────────────────
function lerp(a, b, t) { return a + (b - a) * t; }
function rnd(min, max) { return min + Math.random() * (max - min); }
function rndInt(min, max) { return Math.floor(rnd(min, max + 1)); }

// ─── SKY ─────────────────────────────────────────────────────────────
function drawSky(t) {
  // Sunset/dusk gradient
  const g = ctx.createLinearGradient(0, 0, 0, getMaxH() * 0.65);
  g.addColorStop(0, '#1a1a2e');
  g.addColorStop(0.3, '#3d2c5f');
  g.addColorStop(0.55, '#c5623b');
  g.addColorStop(0.75, '#e8a047');
  g.addColorStop(1, '#f5c27a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight * 0.65);

  // Sun glow
  const sunX = window.innerWidth * 0.72;
  const sunY = getMaxH() * 0.42;
  const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 90 * dpr);
  sunGrad.addColorStop(0, 'rgba(255,220,120,0.9)');
  sunGrad.addColorStop(0.4, 'rgba(255,160,60,0.4)');
  sunGrad.addColorStop(1, 'rgba(255,100,30,0)');
  ctx.fillStyle = sunGrad;
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
}

// ─── TERRAIN ────────────────────────────────────────────────────────
let groundOffset = 0;
function drawGround() {
  const gY = getMaxH() * 0.65;
  const gh = getMaxH() * 0.35;
  const g = ctx.createLinearGradient(0, gY, 0, gY + gh);
  g.addColorStop(0, '#3a3020');
  g.addColorStop(1, '#1a1510');
  ctx.fillStyle = g;
  ctx.fillRect(0, gY, window.innerWidth, gh);

  // Road surface
  const roadY = gY + gh * 0.55;
  const roadH = gh * 0.12;
  ctx.fillStyle = '#252320';
  ctx.fillRect(0, roadY, window.innerWidth, roadH);

  // Road edge lines
  ctx.strokeStyle = '#5a5040';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, roadY);
  ctx.lineTo(window.innerWidth, roadY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, roadY + roadH);
  ctx.lineTo(window.innerWidth, roadY + roadH);
  ctx.stroke();

  // Center dashes (scrolling)
  ctx.strokeStyle = '#6a6050';
  ctx.lineWidth = 3;
  ctx.setLineDash([40, 30]);
  ctx.lineDashOffset = -groundOffset;
  ctx.beginPath();
  ctx.moveTo(0, roadY + roadH / 2);
  ctx.lineTo(window.innerWidth, roadY + roadH / 2);
  ctx.stroke();
  ctx.setLineDash([]);
}

// ─── HILLS (distant mountains) ──────────────────────────────────────
const hills = [];
function initHills() {
  hills.length = 0;
  for (let i = 0; i < 8; i++) {
    hills.push({
      x: i * 320 - 200,
      w: rnd(180, 320),
      h: rnd(80, 160),
      col: `hsl(${rndInt(240,280)},${rndInt(20,35)}%,${rndInt(20,35)}%)`
    });
  }
}
function drawHills(speed) {
  const baseY = getMaxH() * 0.55;
  hills.forEach(h => {
    h.x -= speed * 0.15;
    if (h.x + h.w < 0) h.x += window.innerWidth * 2 + h.w;
    ctx.fillStyle = h.col;
    ctx.beginPath();
    ctx.moveTo(h.x, baseY);
    ctx.quadraticCurveTo(h.x + h.w * 0.5, baseY - h.h, h.x + h.w, baseY);
    ctx.closePath();
    ctx.fill();
  });
}

// ─── TREES ───────────────────────────────────────────────────────────
const trees = [];
function initTrees() {
  trees.length = 0;
  for (let i = 0; i < 12; i++) {
    trees.push(makeTree(rnd(0, window.innerWidth * 2)));
  }
}
function makeTree(x) {
  return {
    x,
    h: rnd(60, 110),
    w: rnd(30, 50),
    type: rnd(0, 1) > 0.5 ? 'pine' : 'round',
    col: `hsl(${rndInt(100,140)},${rndInt(30,50)}%,${rndInt(20,35)}%)`
  };
}
function drawTrees(speed) {
  const baseY = getMaxH() * 0.65;
  trees.forEach(t => {
    t.x -= speed * 0.45;
    if (t.x + t.w < 0) t.x += window.innerWidth + 200;
    drawTree(t.x, baseY, t.h, t.w, t.type, t.col);
  });
}
function drawTree(x, y, h, w, type, col) {
  // Trunk
  ctx.fillStyle = '#2a1f15';
  ctx.fillRect(x + w * 0.35, y - h * 0.35, w * 0.3, h * 0.35);
  // Foliage
  ctx.fillStyle = col;
  if (type === 'pine') {
    ctx.beginPath();
    ctx.moveTo(x, y - h * 0.35);
    ctx.lineTo(x + w * 0.5, y - h);
    ctx.lineTo(x + w, y - h * 0.35);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + w * 0.1, y - h * 0.55);
    ctx.lineTo(x + w * 0.5, y - h * 0.85);
    ctx.lineTo(x + w * 0.9, y - h * 0.55);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.arc(x + w * 0.5, y - h * 0.5, w * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + w * 0.3, y - h * 0.65, w * 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + w * 0.7, y - h * 0.6, w * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ─── POLES ──────────────────────────────────────────────────────────
const poles = [];
function initPoles() {
  poles.length = 0;
  for (let i = 0; i < 8; i++) {
    poles.push({ x: i * 280 + rnd(0, 100), h: rnd(70, 100) });
  }
}
function drawPoles(speed) {
  const baseY = getMaxH() * 0.65;
  poles.forEach(p => {
    p.x -= speed * 0.65;
    if (p.x < -20) p.x += window.innerWidth + 200;
    // Pole
    ctx.fillStyle = '#4a4035';
    ctx.fillRect(p.x, baseY - p.h, 4, p.h);
    // Cross beam
    ctx.fillRect(p.x - 12, baseY - p.h, 28, 3);
    // Wire
    ctx.strokeStyle = '#3a3530';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(p.x - 12, baseY - p.h + 2);
    ctx.lineTo(p.x + 16, baseY - p.h + 2);
    ctx.stroke();
  });
}

// ─── CAR ────────────────────────────────────────────────────────────
let wheelRot = 0;
let carBob = 0;
let carX = 0;

function drawCar(t) {
  const maxH = getMaxH();
  const roadY = maxH * 0.65 + maxH * 0.35 * 0.55 + maxH * 0.35 * 0.12;
  const carW = 220;
  const carH = 80;
  const carY = roadY - carH * 0.5;

  // Subtle vertical bob
  carBob += 0.06;
  const bob = Math.sin(carBob) * 1.5;

  // Slight horizontal drift
  carX -= 0.4;
  const drift = Math.sin(carBob * 0.7) * 0.8;

  ctx.save();
  ctx.translate(window.innerWidth * 0.22 + drift, carY + bob);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(carW * 0.5, carH + 4, carW * 0.45, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body base
  ctx.fillStyle = '#8c2828';
  ctx.beginPath();
  ctx.roundRect(20, carH * 0.4, carW - 40, carH * 0.5, 6);
  ctx.fill();

  // Cabin
  ctx.fillStyle = '#6e1e1e';
  ctx.beginPath();
  ctx.moveTo(70, carH * 0.4);
  ctx.lineTo(95, carH * 0.05);
  ctx.lineTo(170, carH * 0.05);
  ctx.lineTo(185, carH * 0.4);
  ctx.closePath();
  ctx.fill();

  // Windows
  ctx.fillStyle = 'rgba(120,180,220,0.4)';
  ctx.beginPath();
  ctx.moveTo(80, carH * 0.38);
  ctx.lineTo(95, carH * 0.12);
  ctx.lineTo(130, carH * 0.12);
  ctx.lineTo(130, carH * 0.38);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(135, carH * 0.12);
  ctx.lineTo(135, carH * 0.38);
  ctx.lineTo(165, carH * 0.38);
  ctx.lineTo(165, carH * 0.12);
  ctx.closePath();
  ctx.fill();

  // Headlights
  ctx.fillStyle = '#f5e090';
  ctx.beginPath();
  ctx.ellipse(carW - 22, carH * 0.6, 7, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fffae0';
  ctx.beginPath();
  ctx.ellipse(carW - 22, carH * 0.6, 4, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // Taillights
  ctx.fillStyle = '#cc2020';
  ctx.beginPath();
  ctx.ellipse(22, carH * 0.6, 5, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Wheels
  drawWheel(55, carH + 2, 26);
  drawWheel(carW - 55, carH + 2, 26);

  ctx.restore();
}

function drawWheel(x, y, r) {
  wheelRot += 0.12;

  ctx.save();
  ctx.translate(x, y);

  // Tire
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // Rim
  ctx.fillStyle = '#c0c0c0';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.65, 0, Math.PI * 2);
  ctx.fill();

  // Spokes
  ctx.save();
  ctx.rotate(wheelRot);
  ctx.strokeStyle = '#a0a0a0';
  ctx.lineWidth = 3;
  for (let i = 0; i < 5; i++) {
    ctx.save();
    ctx.rotate((Math.PI * 2 / 5) * i);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(r * 0.55, 0);
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

  // Hub
  ctx.fillStyle = '#888';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// ─── GRASS & DETAILS ────────────────────────────────────────────────
const grassPatches = [];
function initGrass() {
  grassPatches.length = 0;
  for (let i = 0; i < 20; i++) {
    grassPatches.push({ x: i * 120 + rnd(0, 60), w: rnd(15, 40) });
  }
}
function drawGrass(speed) {
  const baseY = getMaxH() * 0.65;
  grassPatches.forEach(g => {
    g.x -= speed * 0.3;
    if (g.x + g.w < 0) g.x += window.innerWidth + 100;
    ctx.fillStyle = '#2a3820';
    ctx.fillRect(g.x, baseY - 8, g.w, 10);
    ctx.fillStyle = '#3a4830';
    ctx.fillRect(g.x + 2, baseY - 14, 3, 14);
    ctx.fillRect(g.x + g.w * 0.4, baseY - 10, 2, 10);
    ctx.fillRect(g.x + g.w * 0.7, baseY - 12, 3, 12);
  });
}

// ─── BIRDS (ambient) ─────────────────────────────────────────────────
const birds = [];
function initBirds() {
  birds.length = 0;
  for (let i = 0; i < 6; i++) {
    birds.push({
      x: rnd(0, window.innerWidth),
      y: rnd(getMaxH() * 0.1, getMaxH() * 0.35),
      sp: rnd(0.3, 0.8),
      phase: rnd(0, Math.PI * 2)
    });
  }
}
function drawBirds(t) {
  birds.forEach(b => {
    b.x += b.sp;
    if (b.x > window.innerWidth + 20) b.x = -20;
    const by = b.y + Math.sin(t * 0.03 + b.phase) * 8;
    ctx.strokeStyle = '#2a1a1a';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(b.x - 6, by);
    ctx.quadraticCurveTo(b.x - 2, by - 5, b.x, by);
    ctx.quadraticCurveTo(b.x + 2, by - 5, b.x + 6, by);
    ctx.stroke();
  });
}

// ─── CLOUDS ─────────────────────────────────────────────────────────
const clouds = [];
function initClouds() {
  clouds.length = 0;
  for (let i = 0; i < 5; i++) {
    clouds.push({
      x: rnd(0, window.innerWidth),
      y: rnd(getMaxH() * 0.05, getMaxH() * 0.25),
      w: rnd(100, 200),
      sp: rnd(0.1, 0.35)
    });
  }
}
function drawClouds() {
  clouds.forEach(c => {
    c.x += c.sp;
    if (c.x > window.innerWidth + c.w) c.x = -c.w;
    ctx.fillStyle = 'rgba(80,60,100,0.3)';
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.w * 0.3, 0, Math.PI * 2);
    ctx.arc(c.x + c.w * 0.25, c.y - c.w * 0.1, c.w * 0.35, 0, Math.PI * 2);
    ctx.arc(c.x + c.w * 0.55, c.y, c.w * 0.3, 0, Math.PI * 2);
    ctx.fill();
  });
}

// ─── INIT & LOOP ────────────────────────────────────────────────────
initHills();
initTrees();
initPoles();
initGrass();
initBirds();
initClouds();

const BASE_SPEED = 2.5;
let time = 0;

function loop() {
  time++;
  groundOffset += BASE_SPEED;

  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

  drawSky(time);
  drawClouds();
  drawBirds(time);
  drawHills(BASE_SPEED);
  drawGround();
  drawGrass(BASE_SPEED);
  drawTrees(BASE_SPEED);
  drawPoles(BASE_SPEED);
  drawCar(time);

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
